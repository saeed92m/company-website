<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">Powertrain telemetry analysis</title><desc id="d">A conceptual telemetry chart showing engine speed, boost and vehicle speed over a test lap.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0b2b52"/></linearGradient></defs><rect width="900" height="560" rx="28" fill="url(#bg)"/><g stroke="#6d91b8" stroke-opacity=".2"><path d="M95 115V440H830M95 190H830M95 270H830M95 350H830"/></g><g fill="none" stroke-width="5" stroke-linecap="round"><path d="M110 330 C180 290 210 170 285 200 S400 370 470 310 S580 140 650 180 S750 300 815 220" stroke="#4cc7ff"/><path d="M110 380 C180 350 230 290 285 300 S400 335 470 290 S580 245 650 260 S750 320 815 280" stroke="#f4d77a"/><path d="M110 410 C180 400 230 360 285 365 S400 380 470 350 S580 300 650 315 S750 360 815 340" stroke="#5de1c1"/></g><g fill="#d8e8f8" font-family="Arial" font-size="18"><text x="70" y="75">POWERTRAIN TELEMETRY</text><text x="110" y="490">TEST TIME →</text><text x="110" y="525">Illustrative traces · no vehicle test data</text></g><g font-family="Arial" font-size="16"><text x="690" y="120" fill="#4cc7ff">Engine speed</text><text x="690" y="148" fill="#f4d77a">Boost pressure</text><text x="690" y="176" fill="#5de1c1">Vehicle speed</text></g></svg>