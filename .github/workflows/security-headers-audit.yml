name: GitHub Pages Security Headers Audit

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "47 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  inspect-headers:
    name: Inspect deployed HTTPS response headers
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Capture response headers
        shell: bash
        env:
          BASE_URL: https://saeed92m.github.io/company-website
        run: |
          set -euo pipefail

          header_value() {
            local wanted="$1"
            local headers_file="$2"
            awk -v wanted="$wanted" '
              /^HTTP\// { value=""; found=0; next }
              {
                colon=index($0, ":")
                if (colon > 0) {
                  name=tolower(substr($0, 1, colon - 1))
                  if (name == wanted) {
                    value=substr($0, colon + 1)
                    sub(/^[ \t]+/, "", value)
                    sub(/\r$/, "", value)
                    found=1
                  }
                }
              }
              END { if (found) print value }
            ' "$headers_file"
          }

          # Verify that redirects do not cause headers from an earlier response
          # to be reported as headers from the final response.
          fixture="$(mktemp)"
          cat > "$fixture" <<'EOF'
          HTTP/2 301
          strict-transport-security: old-value
          location: https://example.invalid/final

          HTTP/2 200
          strict-transport-security: max-age=31536000; includeSubDomains
          x-content-type-options: nosniff
          EOF
          test "$(header_value strict-transport-security "$fixture")" = "max-age=31536000; includeSubDomains"
          test "$(header_value x-content-type-options "$fixture")" = "nosniff"
          test -z "$(header_value content-security-policy "$fixture")"
          rm -f "$fixture"

          inspect() {
            local label="$1"
            local url="$2"
            local headers_file
            local status
            headers_file="$(mktemp)"

            status="$(curl --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --retry 3 --retry-delay 2 --max-time 30 \
              --dump-header "$headers_file" --output /dev/null \
              --write-out '%{http_code}' "$url")"

            {
              echo "## $label"
              echo
              echo "- URL: $url"
              echo "- Final HTTP status: $status"
              for header in \
                strict-transport-security \
                content-security-policy \
                x-content-type-options \
                referrer-policy \
                permissions-policy \
                x-frame-options; do
                value="$(header_value "$header" "$headers_file")"
                if [ -n "$value" ]; then
                  printf -- '- %s: %s\n' "$header" "$value"
                else
                  printf -- '- %s: MISSING\n' "$header"
                fi
              done
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"

            rm -f "$headers_file"
            if [ "$status" != "200" ]; then
              echo "FAIL: $label returned HTTP $status"
              return 1
            fi
          }

          inspect "Persian homepage" "$BASE_URL/fa/"
          inspect "English homepage" "$BASE_URL/en/"
          inspect "Static image asset" "$BASE_URL/assets/domains/astronomy.webp"
          inspect "Sitemap" "$BASE_URL/sitemap.xml"

          echo "Header presence is reported for owner review. This diagnostic workflow does not claim that missing headers are configured or enforced."
