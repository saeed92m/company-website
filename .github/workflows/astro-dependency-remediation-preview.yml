name: Temporary Astro dependency remediation preview

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/astro-dependency-remediation-preview.yml"

permissions:
  contents: write

concurrency:
  group: astro-remediation-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        if: ${{ github.event.pull_request.number == 135 && github.event.pull_request.user.login == 'saeed92m' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Update Astro to the verified patched release
        run: npm install --save-exact astro@7.4.11 --ignore-scripts --no-audit --no-fund

      - name: Verify clean lockfile installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit full dependency graph
        run: npm audit --audit-level=high

      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=low

      - name: Run tests
        run: npm test

      - name: Run Astro diagnostics
        run: npm run check

      - name: Build static site
        env:
          PUBLIC_SITE_URL: https://saeed92m.github.io/company-website
          PUBLIC_BASE_PATH: /company-website
        run: npm run build

      - name: Commit verified dependency update and remove temporary workflow
        if: ${{ github.event.pull_request.number == 135 && github.event.pull_request.user.login == 'saeed92m' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/astro-dependency-remediation-preview.yml
          git commit -m "fix(deps): upgrade Astro to patched 7.4.11"
          git push origin "HEAD:refs/heads/$BRANCH"
