name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      - name: Fetch canonical supplied logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/brand
          curl -fL --retry 3 --retry-delay 2 \
            "https://dl.dropboxusercontent.com/scl/fi/aqibwvywas752lppcrkad/IMG_6104.PNG?rlkey=kd5v1u6n3ae3dgzrgvtrfrtb4&dl=1" \
            -o public/brand/IMG_6104.PNG
          python3 - <<'PY'
          import struct, hashlib
          from pathlib import Path
          p = Path("public/brand/IMG_6104.PNG")
          data = p.read_bytes()
          expected_sha = "4ae04c1890bb3802047c055e9dbae10ab9a2fd043c43e29d0cc7591c06e34825"
          actual_sha = hashlib.sha256(data).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"FAIL canonical logo SHA-256 mismatch: {actual_sha}")
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("FAIL canonical logo is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (1254, 1254):
              raise SystemExit(f"FAIL canonical logo dimensions: {width}x{height}")
          print(f"PASS canonical logo: SHA-256 {actual_sha}, {width}x{height}")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          PUBLIC_SITE_URL: https://saeed92m.github.io/company-website
          PUBLIC_BASE_PATH: /company-website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke-test deployed Pages routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://saeed92m.github.io/company-website"
          locales=(fa en ar ru de zh fr es)
          routes=(
            "/"
            "/sitemap.xml"
            "/robots.txt"
          )

          for locale in "${locales[@]}"; do
            routes+=(
              "/${locale}/"
              "/${locale}/company/"
              "/${locale}/company/ceo/"
              "/${locale}/fields/"
              "/${locale}/projects/"
              "/${locale}/contact/"
              "/${locale}/fields/astronomy/"
              "/${locale}/fields/aerospace/"
              "/${locale}/fields/remote-sensing/"
              "/${locale}/fields/energy/"
              "/${locale}/fields/artificial-intelligence/"
              "/${locale}/fields/motorsport/"
            )
          done

          for route in "${routes[@]}"; do
            code="$(curl -L -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 2 "${base}${route}")"
            if [ "$code" != "200" ]; then
              echo "FAIL ${route}: HTTP $code"
              exit 1
            fi
            echo "PASS ${route}: HTTP 200"
          done

          # HTTP 200 alone is not sufficient for production QA: a page can be
          # reachable while its stylesheet or critical brand assets are missing.
          html="$(curl -L -sS --retry 3 --retry-delay 2 "${base}/en/")"
          stylesheet="$(printf '%s' "$html" | grep -oE 'href="[^"]+\.css"' | head -n 1 | sed -E 's/^href="|"$//g')"
          if [ -z "$stylesheet" ]; then
            echo "FAIL /en/: no stylesheet link found"
            exit 1
          fi
          css_url="$stylesheet"
          case "$css_url" in
            http://*|https://*) ;;
            /*) css_url="https://saeed92m.github.io$css_url" ;;
            *) css_url="${base%/}/${css_url#./}" ;;
          esac
          css="$(curl -L -sS --retry 3 --retry-delay 2 "$css_url")"
          for marker in ".site-header" ".hero-brand" ".domain-card"; do
            if ! printf '%s' "$css" | grep -Fq "$marker"; then
              echo "FAIL CSS: expected marker $marker not found in $css_url"
              exit 1
            fi
          done
          echo "PASS /en/: production stylesheet loaded with expected UI markers"
          for route in "/en/" "/en/company/ceo/" "/fa/" "/fa/company/ceo/"; do
            html="$(curl -L -sS --retry 3 --retry-delay 2 "${base}${route}")"
            if ! printf '%s' "$html" | grep -Fq 'IMG_6104.PNG'; then
              echo "FAIL ${route}: local brand asset reference missing"
              exit 1
            fi
            echo "PASS ${route}: local brand asset reference present"
          done

          logo_url="${base}/brand/IMG_6104.PNG"
          logo_code="$(curl -L -sS -o /tmp/site-logo -w "%{http_code}" --retry 3 --retry-delay 2 "$logo_url")"
          if [ "$logo_code" != "200" ] || ! python3 -c 'import sys; d=open("/tmp/site-logo","rb").read(8); sys.exit(0 if d==b"\x89PNG\r\n\x1a\n" else 1)'; then
            echo "FAIL local brand asset: HTTP $logo_code or invalid PNG payload"
            exit 1
          fi
          echo "PASS local brand asset: HTTP 200 + PNG"

          for asset in \
            "/assets/domains/astronomy.svg" \
            "/assets/domains/aerospace.svg" \
            "/assets/domains/remote-sensing.svg" \
            "/assets/domains/energy.svg" \
            "/assets/domains/artificial-intelligence.svg" \
            "/assets/domains/motorsport.svg"; do
            code="$(curl -L -sS -o /tmp/site-asset -w "%{http_code}" --retry 3 --retry-delay 2 "${base}${asset}")"
            if [ "$code" != "200" ] || ! grep -q "<svg" /tmp/site-asset; then
              echo "FAIL asset ${asset}: HTTP $code or invalid SVG payload"
              exit 1
            fi
            echo "PASS asset ${asset}: HTTP 200 + SVG"
          done