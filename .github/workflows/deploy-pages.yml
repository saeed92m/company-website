name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          PUBLIC_SITE_URL: https://saeed92m.github.io/company-website
          PUBLIC_BASE_PATH: /company-website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke-test deployed Pages routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://saeed92m.github.io/company-website"
          routes=(
            "/"
            "/fa/"
            "/en/"
            "/ar/"
            "/ru/"
            "/de/"
            "/zh/"
            "/fr/"
            "/es/"
            "/fa/company/"
            "/fa/company/ceo/"
            "/fa/fields/"
            "/fa/projects/"
            "/fa/contact/"
            "/sitemap-index.xml"
            "/robots.txt"
          )
          for route in "${routes[@]}"; do
            code="$(curl -L -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 2 "${base}${route}")"
            if [ "$code" != "200" ]; then
              echo "FAIL ${route}: HTTP ${code}"
              exit 1
            fi
            echo "PASS ${route}: HTTP 200"
          done
