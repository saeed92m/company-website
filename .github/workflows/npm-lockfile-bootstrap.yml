name: Generate and validate npm lockfile

on:
  push:
    branches:
      - maintenance/deterministic-npm-lockfile

permissions:
  contents: write

concurrency:
  group: npm-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean lockfile installation
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check
          npm run build

      - name: Audit declared project dependencies
        if: always()
        run: |
          mkdir -p audit-evidence
          npm audit --json > audit-evidence/project-audit.json || true
          npm audit --omit=dev --json > audit-evidence/project-production-audit.json || true

      - name: Reproduce Browser QA temporary install and audit
        if: always() && hashFiles('package-lock.json') != ''
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 --no-fund || true
          npm audit --json > audit-evidence/browser-qa-audit.json || true
          npm audit --omit=dev --json > audit-evidence/browser-qa-production-audit.json || true

      - name: Summarize audit evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of fs.readdirSync('audit-evidence').filter((name) => name.endsWith('.json'))) {
            const report = JSON.parse(fs.readFileSync(`audit-evidence/${file}`, 'utf8'));
            const counts = report.metadata?.vulnerabilities ?? {};
            const names = Object.keys(report.vulnerabilities ?? {});
            const line = `- ${file}: info=${counts.info ?? 0}, low=${counts.low ?? 0}, moderate=${counts.moderate ?? 0}, high=${counts.high ?? 0}, critical=${counts.critical ?? 0}; affected packages: ${names.length ? names.join(', ') : 'none reported'}`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\\n');
          }
          NODE

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-evidence
          path: audit-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated lockfile and remove bootstrap workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/npm-lockfile-bootstrap.yml
          git add package-lock.json
          git commit -m "build(deps): add reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
