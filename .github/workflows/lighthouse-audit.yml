name: Lighthouse Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "13 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse mobile and desktop
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy: [mobile, desktop]
        locale: [fa, en]
        route: [home, projects, contact]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4

      - name: Run Lighthouse
        env:
          STRATEGY: ${{ matrix.strategy }}
          LOCALE: ${{ matrix.locale }}
          ROUTE: ${{ matrix.route }}
        run: |
          set -euo pipefail
          case "$ROUTE" in
            home) suffix="" ;;
            projects) suffix="projects/" ;;
            contact) suffix="contact/" ;;
          esac
          url="https://saeed92m.github.io/company-website/$LOCALE/$suffix"
          lighthouse_args=()
          if [[ "$STRATEGY" == "desktop" ]]; then
            lighthouse_args+=(--preset=desktop)
          fi
          npx --yes lighthouse@12.8.2 "$url" \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            "${lighthouse_args[@]}" \
            --output=json \
            --output-path=/tmp/lighthouse.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("/tmp/lighthouse.json","utf8"));
          const score = id => Math.round((report.categories[id]?.score ?? 0) * 100);
          const audits = report.audits;
          const rows = [
            ["Performance", score("performance")],
            ["Accessibility", score("accessibility")],
            ["Best Practices", score("best-practices")],
            ["SEO", score("seo")],
          ];
          const metric = id => audits[id]?.displayValue ?? "not available";
          const diagnosticIds = [
            "largest-contentful-paint-element",
            "layout-shift-elements",
            "lcp-discovery-insight",
            "image-delivery-insight",
            "font-display",
            "render-blocking-resources",
          ];
          const diagnostics = diagnosticIds
            .filter(id => audits[id])
            .map(id => ({
              id,
              title: audits[id].title,
              displayValue: audits[id].displayValue ?? null,
              score: audits[id].score ?? null,
              details: (audits[id].details?.items ?? []).slice(0, 5),
            }));
          const summary = [
            `## Lighthouse — ${process.env.LOCALE} / ${process.env.ROUTE} / ${process.env.STRATEGY}`,
            "",
            "| Category | Score |",
            "|---|---:|",
            ...rows.map(([name,value])=>`| ${name} | ${value} |`),
            "",
            `- LCP: ${metric("largest-contentful-paint")}`,
            `- CLS: ${metric("cumulative-layout-shift")}`,
            `- TBT: ${metric("total-blocking-time")}`,
            `- FCP: ${metric("first-contentful-paint")}`,
            `- Speed Index: ${metric("speed-index")}`,
            "",
            "### Diagnostic audits",
            "```json",
            JSON.stringify(diagnostics, null, 2),
            "```",
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n\n");
          console.log(summary);
          NODE

      - name: Upload Lighthouse JSON report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-${{ matrix.strategy }}-${{ matrix.locale }}-${{ matrix.route }}-${{ github.sha }}
          path: /tmp/lighthouse.json
          if-no-files-found: error
          retention-days: 14
