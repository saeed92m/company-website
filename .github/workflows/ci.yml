name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**', 'design/**']

permissions:
  contents: read

jobs:
  baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f docs/handbook/README.md
          test -f docs/architecture/README.md
          echo "Repository baseline validation passed."

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: JSON-LD serialization regression tests
        run: npm test

      - name: Astro type and project check
        run: npm run check

      - name: Production build
        run: npm run build
