name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f docs/handbook/README.md
          test -f docs/architecture/README.md
          echo "Repository baseline validation passed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Astro type and project check
        run: npm run check

      - name: Production build
        run: npm run build
