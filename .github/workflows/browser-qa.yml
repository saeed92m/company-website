name: Browser QA

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    concurrency:
      group: browser-qa-${{ github.workflow }}-${{ github.event.workflow_run.id || github.run_id }}-${{ matrix.browser }}
      cancel-in-progress: true
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"

      - name: Install Playwright browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run production browser checks
        env:
          BASE_URL: https://saeed92m.github.io/company-website
          BROWSER: ${{ matrix.browser }}
        run: |
          cat > browser-qa.mjs <<'EOF'
          import { chromium, firefox, webkit } from "playwright";

          const base = process.env.BASE_URL;
          const browserName = process.env.BROWSER || "chromium";
          const browserType = { chromium, firefox, webkit }[browserName];
          if (!browserType) throw new Error(`Unsupported browser: ${browserName}`);

          const locales = ["fa","en","ar","ru","de","zh","fr","es"];
          const routes = [
            "",
            "company/",
            "company/ceo/",
            "fields/",
            "projects/",
            "contact/",
          ];

          const browser = await browserType.launch({headless:true});
          const results = [];

          for (const viewport of [
            { width: 390, height: 844, name: "mobile" },
            { width: 1440, height: 900, name: "desktop" },
          ]) {
            const context = await browser.newContext({ viewport });
            for (const locale of locales) {
              for (const suffix of routes) {
                const url = `${base}/${locale}/${suffix}`;
                const page = await context.newPage();
                let response;
                let lastError;
                for (let attempt = 1; attempt <= 4; attempt++) {
                  try {
                    response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 30000 });
                    if (response && response.ok()) break;
                    const status = response?.status();
                    if (status && status < 500 && status !== 429) throw new Error(`${url}: non-retryable HTTP ${status}`);
                    lastError = new Error(`${url}: transient HTTP ${status ?? "no response"} (attempt ${attempt}/4)`);
                  } catch (error) {
                    if (String(error.message).includes("non-retryable HTTP")) throw error;
                    lastError = error;
                  }
                  if (attempt < 4) await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
                }
                if (!response || !response.ok()) throw lastError || new Error(`${url}: request failed after 4 attempts`);

                const checks = await page.evaluate(() => ({
                  dir: document.documentElement.dir,
                  lang: document.documentElement.lang,
                  title: document.title,
                  horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                  hasMain: Boolean(document.querySelector("main#main-content")),
                  hasHeader: Boolean(document.querySelector("header.site-header")),
                  hasBrand: Boolean(document.querySelector("header .brand svg, header .brand img")),
                  hasStyles: [...document.styleSheets].length > 0,
                  visibleText: (document.body.innerText || "").trim().length > 0,
                  h1Count: document.querySelectorAll("h1").length,
                  hasSkipLink: Boolean(document.querySelector('a.skip-link[href="#main-content"]')),
                  hasPrimaryNavLabel: Boolean(document.querySelector("nav.primary-nav[aria-label]")),
                  unnamedLinks: [...document.querySelectorAll("a")].filter((a) => !(a.textContent || "").trim() && !a.getAttribute("aria-label") && !a.querySelector("img[alt]")).length,
                  unlabeledImages: [...document.querySelectorAll("img")].filter((img) => !img.hasAttribute("alt")).length,
                  unlabeledControls: [...document.querySelectorAll("button")].filter((el) => !(el.textContent || "").trim() && !el.getAttribute("aria-label")).length + [...document.querySelectorAll("select")].filter((el) => !el.getAttribute("aria-label") && !el.closest("label")).length,
                }));

                if (!checks.title || !checks.hasMain || !checks.hasHeader || !checks.hasBrand || !checks.hasStyles || !checks.visibleText || checks.h1Count !== 1 || !checks.hasSkipLink || !checks.hasPrimaryNavLabel || checks.unnamedLinks || checks.unlabeledImages || checks.unlabeledControls) {
                  throw new Error(`${url} [${viewport.name}]: structural check failed: ${JSON.stringify(checks)}`);
                }
                await page.keyboard.press("Tab");
                const focused = await page.evaluate(() => document.activeElement?.matches('a.skip-link'));
                if (!focused) throw new Error(`${url} [${viewport.name}]: skip link is not keyboard-focusable`);

                if (checks.horizontalOverflow) {
                  throw new Error(`${url} [${viewport.name}]: horizontal overflow detected`);
                }
                if (checks.lang !== locale) throw new Error(`${url}: expected lang=${locale}, got ${checks.lang}`);
                const expectedDir = locale === "fa" || locale === "ar" ? "rtl" : "ltr";
                if (checks.dir !== expectedDir) throw new Error(`${url}: expected dir=${expectedDir}, got ${checks.dir}`);

                if (suffix === "company/") {
                  const viewButton = page.locator('a.button.button-secondary', { hasText: locale === "fa" ? "مشاهده" : locale === "en" ? "View" : "" });
                  if (locale === "fa" || locale === "en") {
                    if (await viewButton.count() !== 1) throw new Error(`${url}: CEO View button missing`);
                  }
                }

                if (suffix === "" || suffix === "projects/") {
                  const projectSection = suffix === "" ? page.locator("#projects") : page.locator(".project-grid");
                  const projectCards = projectSection.locator(".project-card");
                  const count = await projectCards.count();
                  if (count !== 3) throw new Error(`${url}: expected 3 project cards, got ${count}`);
                  const summaryButtons = projectSection.locator(".project-summary-trigger");
                  if (await summaryButtons.count() !== 3) throw new Error(`${url}: expected 3 project summary buttons`);
                  const platformCard = projectSection.locator(".project-card", { has: page.locator("h3", { hasText: "Company Platform" }) });
                  if (await platformCard.count() !== 1) throw new Error(`${url}: Company Platform card missing`);
                  await summaryButtons.first().click();
                  const dialog = page.locator("dialog.project-dialog");
                  if (await dialog.count() !== 3 || !(await dialog.first().isVisible())) throw new Error(`${url}: project summary dialog did not open`);
                  const summaryText = await dialog.first().locator(".project-dialog__description").innerText();
                  if (!summaryText.trim()) throw new Error(`${url}: project summary is empty`);
                  await page.keyboard.press("Escape");
                  if (await dialog.first().isVisible()) throw new Error(`${url}: Escape did not close project summary dialog`);
                }

                results.push({browser: browserName, viewport: viewport.name, locale, route: suffix || "/"});
                await page.close();
              }
            }
            await context.close();
          }

          await browser.close();
          console.log(`PASS: ${results.length} production route/viewport checks in ${browserName}`);
          EOF
          node browser-qa.mjs
