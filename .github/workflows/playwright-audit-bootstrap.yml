name: Finalize and audit npm lockfile

on:
  push:
    branches:
      - maintenance/deterministic-npm-lockfile

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean install, tests, check and build
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check
          npm run build

      - name: Audit locked dependency graph
        if: always()
        run: |
          mkdir -p audit-evidence
          npm audit --json > audit-evidence/npm-audit.json || true
          npm audit --omit=dev --json > audit-evidence/npm-production-audit.json || true

      - name: Summarize audit results
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of fs.readdirSync('audit-evidence')) {
            const report = JSON.parse(fs.readFileSync(`audit-evidence/${file}`, 'utf8'));
            const counts = report.metadata?.vulnerabilities ?? {};
            const names = Object.keys(report.vulnerabilities ?? {});
            const line = `- ${file}: info=${counts.info ?? 0}, low=${counts.low ?? 0}, moderate=${counts.moderate ?? 0}, high=${counts.high ?? 0}, critical=${counts.critical ?? 0}; affected packages: ${names.length ? names.join(', ') : 'none'}`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\\n');
          }
          NODE

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locked-dependency-audit
          path: audit-evidence/
          retention-days: 14

      - name: Commit lockfile and remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/playwright-audit-bootstrap.yml
          git add package-lock.json
          git commit -m "build(deps): lock audited Playwright and project dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
