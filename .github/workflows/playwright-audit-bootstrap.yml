name: Audit isolated Browser QA dependency

on:
  push:
    branches:
      - maintenance/deterministic-npm-lockfile

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Create isolated Playwright dependency tree
        run: |
          mkdir -p /tmp/playwright-audit
          cd /tmp/playwright-audit
          npm init -y
          npm install --package-lock-only --ignore-scripts --save-exact playwright@1.55.0 --no-fund
          npm ci --ignore-scripts --no-fund
          npm audit --json > "$GITHUB_WORKSPACE/playwright-audit.json" || true

      - name: Summarize isolated audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('playwright-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify({ counts, packages: Object.keys(report.vulnerabilities ?? {}) }, null, 2));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({ name, severity: item.severity, range: item.range, via: item.via, fixAvailable: item.fixAvailable }, null, 2));
          }
          NODE

      - name: Upload isolated Playwright audit
        uses: actions/upload-artifact@v4
        with:
          name: isolated-playwright-audit
          path: playwright-audit.json
          retention-days: 14
